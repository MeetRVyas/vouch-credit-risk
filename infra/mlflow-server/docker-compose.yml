# Self-hosted MLflow tracking server: Postgres backend store + MinIO
# artifact store, exposed to a Kaggle notebook over a tunnel (see README.md
# in this directory). This is a SEPARATE Postgres from the one the API logs
# predictions to (../docker-compose.yml) -- experiment tracking has a
# different lifecycle/consumer than served-prediction monitoring.
#
#   docker compose -f infra/mlflow-server/docker-compose.yml up --build

services:
  mlflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mlflow-artifacts
      "

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:latest
    depends_on:
      mlflow-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "5000:5000"
    command:
      - bash
      - -c
      - >
        pip install psycopg2-binary boto3 &&
        mlflow server
        --backend-store-uri postgresql://mlflow:mlflow@mlflow-db:5432/mlflow
        --artifacts-destination s3://mlflow-artifacts
        --serve-artifacts
        --host 0.0.0.0
        --port 5000
        --allowed-hosts '*.trycloudflare.com,localhost:*,127.0.0.1:*'
        --cors-allowed-origins 'https://*.trycloudflare.com,http://localhost:*,http://127.0.0.1:*'

volumes:
  mlflow_db_data:
  minio_data:
